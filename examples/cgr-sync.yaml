# cgr-sync configuration: mirror Chainguard (cgr.dev) images into a private
# OCI registry. Run with:  cgr-sync -config examples/cgr-sync.yaml [-dry-run]

defaults:
  # Source registry + namespace (your Chainguard org repo).
  source: cgr.dev/example.com
  # Destination registry + namespace (any OCI registry: GAR, Artifactory,
  # Cloudsmith, ...). The repository name is appended unless a repo sets its
  # own full `destination`. ${VAR} is expanded from the environment, so secrets
  # / per-environment values need not be hard-coded:
  destination: ${DEST_REGISTRY}
  # Default tag selection when a repository doesn't specify its own.
  tags:
    list: ["latest"]
  # Optional: verify each image's cosign signature before mirroring (requires
  # the `cosign` binary on PATH). A failed verification blocks the copy.
  verify:
    enabled: true
    certificate_identity: https://github.com/chainguard-images/images-private/.github/workflows/release.yaml@refs/heads/main
    certificate_oidc_issuer: https://token.actions.githubusercontent.com

repositories:
  # Mirror specific tags.
  - name: python
    tags:
      list: ["latest", "3.12", "3.13"]

  # Mirror every tag that matches a regex (and skip ones that match exclude).
  - name: node
    tags:
      all: true
      include: '^[0-9]+$'      # major-version tags like "20", "22"
      exclude: '-dev$'

  # Send one repo to a different destination than the default.
  - name: nginx
    destination: cloudsmith.io/my-org/cgr-mirror/nginx
    tags:
      list: ["latest"]
