name: release

# Build the cgr-sync container (Containerfile) and publish it to GHCR. Triggered
# by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`), or
# manually via workflow_dispatch. Consumers (e.g. the golden-image pass-through
# pipeline) pull the pinned tag instead of building from source.
#
# One-time: make the resulting package (ghcr.io/cartyc/image-syncer) public in
# the repo's Packages settings so it can be pulled without a token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.0 or latest)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f Containerfile --build-arg VERSION="$TAG" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$TAG (and :latest)"
