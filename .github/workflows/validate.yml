name: validate

# Lint, vet, test and build cgr-sync on every PR and on main. Catches
# formatting/vet/test regressions and (once the Containerfile lands) confirms
# the container image still builds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

      # Activates automatically once the Containerfile exists on the branch.
      - name: docker build (Containerfile)
        if: ${{ hashFiles('Containerfile') != '' }}
        run: docker build -f Containerfile -t cgr-sync:ci --build-arg VERSION=ci .
